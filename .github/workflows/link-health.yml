name: Check link health

on:
  push:
    branches: [main, master]
    # The checker commits only this file; ignoring it prevents a loop.
    paths-ignore:
      - public/link-health.json
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check links
        run: node scripts/check-links.mjs

      - name: Commit changed report
        id: commit
        run: |
          if git diff --quiet -- public/link-health.json; then
            echo "Link-health report is unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/link-health.json
          git commit -m "chore: update link health report"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.commit.outputs.changed == 'true'
        run: npm ci

      - name: Refresh technology intelligence and GitHub Trending
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-hot-feed.mjs

      - name: Build updated site
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: Deploy updated health report
        if: steps.commit.outputs.changed == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
