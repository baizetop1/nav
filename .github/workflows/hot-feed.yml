name: Refresh hot feed

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shares the deployment lock used by deploy.yml.
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh social hot list and GitHub Trending
        run: node scripts/update-hot-feed.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy refreshed feed
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
