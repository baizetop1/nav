name: Refresh hot feed

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # All workflows that publish the same gh-pages branch share one lock.
  group: pages-deploy
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Preserve published link health report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/restore-pages-data.mjs link-health.json rss-feed.json

      - name: Refresh technology intelligence and GitHub Trending
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-hot-feed.mjs

      - name: Install dependencies
        run: npm ci

      - name: Refresh RSS subscriptions
        run: node scripts/update-rss.mjs

      - name: Build and verify navigation application
        run: npm run verify:app

      - name: Deploy refreshed feed
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
