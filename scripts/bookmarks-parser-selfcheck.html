<!doctype html>
<meta charset="utf-8" />
<script type="module">
  import { parseBookmarks } from '../src/lib/bookmarks.ts'

  const html = `<DL><p>
    <DT><H3>Work</H3>
    <DL><p>
      <DT><A HREF="HTTPS://Example.COM:443/path#section">Example</A>
      <DT><A HREF="https://example.com/path">Duplicate</A>
      <DT><A HREF="javascript:alert(1)">Unsafe</A>
      <DT><H3>Docs</H3>
      <DL><p><DT><A HREF="https://developer.mozilla.org/">MDN</A></DL><p>
    </DL><p>
  </DL>`
  const actual = parseBookmarks(html)
  const expected = [
    { name: 'Example', url: 'https://example.com/path', category: 'Work' },
    { name: 'MDN', url: 'https://developer.mozilla.org/', category: 'Docs' },
  ]

  if (JSON.stringify(actual) !== JSON.stringify(expected)) {
    throw new Error(`Bookmark parser self-check failed: ${JSON.stringify(actual)}`)
  }
  document.body.textContent = 'Bookmark parser self-check passed'
</script>
